name: trading-research-rag

on:
  push:
    branches: ["main"]
    paths: ["trading-research-rag/**", ".github/workflows/trading-research-rag.yml"]
  pull_request:
    branches: ["main"]
    paths: ["trading-research-rag/**", ".github/workflows/trading-research-rag.yml"]

defaults:
  run:
    working-directory: trading-research-rag

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-research-rag/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
      - name: Build the index and run the eval regression gate
        run: |
          python -m tradingrag.build_index
          python -m tradingrag.eval.run_eval --gate
      - name: Build the index twice and confirm it's byte-identical (idempotency)
        run: |
          python -m tradingrag.build_index | tee /tmp/first.txt
          python -m tradingrag.build_index | tee /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-research-rag/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m tradingrag.build_index
      - name: Start the API and hit it over real HTTP
        run: |
          uvicorn tradingrag.api:app --port 8010 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8010/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8010/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -sf "http://127.0.0.1:8010/search?q=hedge+ratio&top_k=3" | tee /tmp/search.json
          grep -q '"citation"' /tmp/search.json
          curl -sfL http://127.0.0.1:8010/metrics | grep -q tradingrag_search_requests_total

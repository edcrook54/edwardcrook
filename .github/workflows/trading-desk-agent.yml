name: trading-desk-agent

on:
  push:
    paths: ["trading-desk-agent/**", ".github/workflows/trading-desk-agent.yml"]
  pull_request:
    paths: ["trading-desk-agent/**", ".github/workflows/trading-desk-agent.yml"]

defaults:
  run:
    working-directory: trading-desk-agent

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-desk-agent/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: Test (no live API calls; real pm-bayes-pricer subprocess test self-skips if data is absent)
        run: pytest
        env:
          ANTHROPIC_API_KEY: ""

name: llm-news-signal

on:
  push:
    branches: ["main"]
    paths: ["llm-news-signal/**", ".github/workflows/llm-news-signal.yml"]
  pull_request:
    branches: ["main"]
    paths: ["llm-news-signal/**", ".github/workflows/llm-news-signal.yml"]

defaults:
  run:
    working-directory: llm-news-signal

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-news-signal/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - name: Test (no live API calls - extraction tests use recorded/cached responses only)
        run: pytest
        env:
          ANTHROPIC_API_KEY: ""

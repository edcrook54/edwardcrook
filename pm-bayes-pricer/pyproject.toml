[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmq"
version = "0.1.0"
description = "Bayesian fair-value pricing and cross-venue evaluation for prediction markets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "arch>=7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "tenacity>=8.3",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "scipy-stubs>=1.13",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pmq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # teaching notebooks favour readable prose over line-length rules

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

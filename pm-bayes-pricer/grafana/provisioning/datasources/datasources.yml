apiVersion: 1
# Host names differ between Docker (service names) and a local run (localhost), so they come from
# environment variables passed to the Grafana process; see PMQ_PG_HOST / PMQ_PROM_HOST in
# docker-compose.yml and docs/setup.md for running this outside Docker.
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://$__env{PMQ_PROM_HOST}:9090
    isDefault: false
  - name: Postgres
    uid: pg
    type: grafana-postgresql-datasource
    access: proxy
    url: $__env{PMQ_PG_HOST}:5432
    user: $__env{POSTGRES_USER}
    jsonData:
      database: $__env{POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}

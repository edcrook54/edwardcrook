[project]
name = "portfolio"
version = "0.1.0"
description = "Ed Crook — quant / fintech portfolio projects"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "jupyterlab>=4.2",
]

[project.optional-dependencies]
# --- per-project extras: install only what you need for the project you're touching ---
garch = [
    "arch>=7.0",
]
bma-sdf = [
    "qlib",
    "pymc>=5.16",
    "arviz>=0.18",
]
credit-risk = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
# --- shared dev tooling, always installed alongside whatever you're working on ---
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[tool.uv]
# uv sync --extra garch --extra dev
# uv sync --all-extras            (CI / full reproducibility check)

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "projects"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false  # tighten to true once projects mature

[tool.pytest.ini_options]
testpaths = ["tests", "projects"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingrag"
version = "0.1.0"
description = "Hybrid BM25 + LSA retrieval service over my own quant-research corpus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "nbformat>=5.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "pandas>=2.2",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # teaching notebooks favour readable prose over line-length rules

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmsignal"
version = "0.1.0"
description = "Does LLM-extracted FOMC-statement sentiment carry predictive power for BTC/ETH forward returns?"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmsignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "scripts"]  # scripts/ is a one-off data-provenance record, not maintained code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true
